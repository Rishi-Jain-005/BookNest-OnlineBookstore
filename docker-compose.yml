services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  server:
    build: ./server
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/booknest
      JWT_SECRET: change-me-in-env
      NODE_ENV: development
      PORT: "5000"
    depends_on: [mongo]

  client:
    build: ./client
    ports: ["5173:5173"]
    depends_on: [server]

volumes:
  mongo-data:
